name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & build
        working-directory: my-app
        run: |
          npm ci
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: my-app/dist

  backend:
    name: CI backend
    runs-on: ubuntu-latest
    needs: frontend
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backed/requirements.txt

      - name: Lint / Smoke test
        working-directory: backed
        run: |
          python -c "import sys; print('backend environment ok')"

# Secrets
# - Add APOLLO_API_KEY, PROSPEO_API_KEY, BREVO_API_KEY in GitHub repo Settings → Secrets → Actions
# - Do not store any secret values in the repo files.
